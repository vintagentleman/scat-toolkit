[project]
name = "scat-toolkit"
version = "0.1.0"
description = "A toolkit for working with the SCAT corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3",
    "lxml>=6",
    "pyyaml>=6",
    "xlsxwriter>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "ty",
    "pre-commit>=3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
src = ["src", "test"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"] # line length is handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["components", "data", "models", "utils"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.ty.environment]
extra-paths = ["src"]
